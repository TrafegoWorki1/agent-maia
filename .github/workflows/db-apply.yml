name: Aplicar migrações (produção)

# MANUAL e protegido. Nunca roda sozinho e o merge de código NÃO aplica migração.
# Passos: (1) simulação (--dry-run) sempre; (2) aplicação só se "aplicar" = true, e o job usa o ambiente "production",
# que deve exigir a aprovação do owner (Settings > Environments > production > Required reviewers).
# Ordem obrigatória: aplicar a migração ANTES de fazer merge do código que depende dela. Migrações devem ser
# compatíveis com o código antigo (adicionar primeiro, remover depois), porque o deploy do código vem depois.
# Segredos do ambiente production: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar de verdade? (false = só simulação)"
        type: boolean
        default: false
      reconciliar_historico:
        description: "Reconciliar as quatro versões divergentes já verificadas? (altera somente o ledger de migrações)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    # Nome exato do ambiente criado no repositório (Settings > Environments) — "Segredos". Já foi
    # "production" e "Production" antes (10/10/2026); o nome precisa bater exatamente com o configurado,
    # senão o GitHub cria um ambiente novo e vazio na hora, e os secrets reais nunca chegam ao job.
    environment: Segredos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar migrações antes de tocar na produção
        run: pnpm db:validate
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ligar ao projeto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Reconciliar histórico divergente (aprovado pelo owner)
        if: ${{ inputs.reconciliar_historico }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Correspondência verificada por nome, schema remoto e hash da regra; altera somente schema_migrations.
          remote_versions="20261013224420 20261013224832 20261013232551 20261013232602"
          local_versions="20261013194340 20261013200000 20261013200945 20261013210000"
          supabase migration repair --status reverted $remote_versions
          if ! supabase migration repair --status applied $local_versions; then
            echo "A segunda etapa falhou; tentando restaurar o ledger original."
            supabase migration repair --status reverted $local_versions || true
            supabase migration repair --status applied $remote_versions || true
            exit 1
          fi
          supabase migration list
      - name: Simulação (lista o que seria aplicado)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run
      - name: Aplicar
        if: ${{ inputs.aplicar }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
      - name: Conferir que não sobrou divergência
        if: ${{ inputs.aplicar }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: pnpm db:drift
