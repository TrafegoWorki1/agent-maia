name: Schema drift

# Compara o Supabase REAL com o esquema que as migrações do repositório produzem. SOMENTE LEITURA:
# nunca altera o banco. Falha (e avisa) quando alguém muda tabela, função ou política fora de uma migração.
# Segredos necessários (Settings > Secrets > Actions): SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF.
on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comparar esquema real com as migrações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: pnpm db:drift
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-drift-report
          path: db-drift-report.md
          if-no-files-found: ignore
